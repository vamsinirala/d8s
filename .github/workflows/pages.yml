name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build demo app
        env:
          # Served from https://<user>.github.io/d8s/demo/
          BASE_PATH: /d8s/demo/
          VITE_DEMO: "true"
        run: npm run build -w web

      - name: Assemble site
        run: |
          mkdir -p _site/demo _site/screenshots
          cp site/index.html _site/index.html
          cp site/robots.txt _site/robots.txt
          cp site/sitemap.xml _site/sitemap.xml
          cp site/llms.txt _site/llms.txt
          # Google Search Console verification file — must be served verbatim at the site root
          cp site/google*.html _site/
          cp web/public/favicon.svg _site/favicon.svg
          cp docs/screenshots/*.png _site/screenshots/
          cp -R web/dist/. _site/demo/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
